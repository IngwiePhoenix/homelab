---
- name: Install Incus
  community.general.apk:
    name: "{{ incus_packages }}"
    state: present
    update_cache: true

- name: Ensure root has subordinate UID and GID ranges
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    line: "root:1000000:1000000000"
    state: present
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/subuid
    - /etc/subgid

- name: Enable and start the packaged Incus systemd service
  ansible.builtin.systemd_service:
    name: incus.service
    enabled: true
    state: started
