---
- name: Install UFW from the configured APK repositories
  community.general.apk:
    name: ufw
    state: present
    update_cache: true

- name: Install a systemd unit for UFW
  ansible.builtin.copy:
    dest: /etc/systemd/system/ufw.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Uncomplicated Firewall
      Documentation=man:ufw(8)
      DefaultDependencies=no
      Before=network-pre.target
      Wants=network-pre.target
      After=local-fs.target
      Conflicts=nftables.service
      ConditionPathExists=/etc/ufw/ufw.conf

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/lib/ufw/ufw-init start quiet
      ExecStop=/usr/lib/ufw/ufw-init stop

      [Install]
      WantedBy=multi-user.target
  when: ansible_service_mgr == "systemd"

- name: Check whether the native nftables systemd service exists
  ansible.builtin.command:
    argv:
      - systemctl
      - cat
      - nftables.service
  register: ufw_nftables_service
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_service_mgr == "systemd"

- name: Disable and mask the native nftables service
  ansible.builtin.systemd_service:
    name: nftables.service
    enabled: false
    masked: true
    state: stopped
  when:
    - ansible_service_mgr == "systemd"
    - ufw_nftables_service.rc == 0

- name: Check whether nft is installed
  ansible.builtin.command:
    argv:
      - nft
      - --version
  register: ufw_nft_binary
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check whether the native nftables firewall table is loaded
  ansible.builtin.command:
    argv:
      - nft
      - list
      - table
      - inet
      - filter
  register: ufw_native_nft_table
  changed_when: false
  failed_when: ufw_native_nft_table.rc > 1
  check_mode: false
  when: ufw_nft_binary.rc == 0

- name: Remove the native nftables firewall table
  ansible.builtin.command:
    argv:
      - nft
      - delete
      - table
      - inet
      - filter
  when:
    - ufw_nft_binary.rc == 0
    - ufw_native_nft_table.rc == 0
  changed_when: true

- name: Set the default incoming policy to deny
  community.general.ufw:
    policy: deny
    direction: incoming

- name: Set the default outgoing policy to allow
  community.general.ufw:
    policy: allow
    direction: outgoing

- name: Allow configured UFW ports
  community.general.ufw:
    rule: allow
    direction: in
    proto: "{{ item.split('/') | last }}"
    to_port: "{{ item.split('/') | first }}"
    comment: Managed by Ansible
  loop: "{{ (['22/tcp'] + (ufw_ports_allowed | default([])) + (ufw_ports_allowed_extra | default([]))) | unique }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Reload systemd unit definitions
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: ansible_service_mgr == "systemd"

- name: Enable and start UFW at boot with systemd
  ansible.builtin.systemd_service:
    name: ufw.service
    enabled: true
    state: started
  when: ansible_service_mgr == "systemd"

- name: Enable and start UFW at boot with OpenRC
  ansible.builtin.service:
    name: ufw
    use: openrc
    enabled: true
    state: started
  when: ansible_service_mgr == "openrc"
