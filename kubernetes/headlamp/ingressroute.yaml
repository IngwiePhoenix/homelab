apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp-ir
  namespace: headlamp
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`headlamp.birb.it`)
      kind: Rule
      middlewares:
        - name: voidauth-tm
          namespace: voidauth
      services:
        - name: headlamp
          port: 80
