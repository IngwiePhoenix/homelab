apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/headlamp
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab
  dependsOn:
    - name: traefik-ingress
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: headlamp-helmrelease
      namespace: headlamp