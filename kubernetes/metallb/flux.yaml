
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-install
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/metallb/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: metallb-helmrelease
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/metallb/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  dependsOn:
    - name: metallb-install
