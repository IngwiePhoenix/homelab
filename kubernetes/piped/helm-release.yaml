apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piped-helmrelease
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: piped
      version: 8.1.30
      sourceRef:
        kind: HelmRepository
        name: piped-helmrepo
        namespace: flux-system
      interval: 12h

  values:
    frontend:
      env:
        BACKEND_HOSTNAME: pipedapi.birb.it

    backend:
      config:
        PROXY_PART: https://pipedproxy.birb.it
        FRONTEND_URL: https://piped.birb.it
        API_URL: https://pipedapi.birb.it
        database:
          connection_url: jdbc:postgresql://default-cluster-rw.postgres.svc.cluster.local/piped
          secret:
            name: piped-db-creds
            username: LOGIN
            password: PASSWORD

    ingress:
      backend:
        ingressClassName: traefik-internal
        hosts:
          - host: pipedapi.birb.it
            paths:
              - path: /

      main:
        ingressClassName: traefik-internal
        hosts:
          - host: piped.birb.it
            paths:
              - path: /

      ytproxy:
        ingressClassName: traefik-internal
        hosts:
          - host: pipedproxy.birb.it
            paths:
              - path: /

    postgresql:
      enabled: false
