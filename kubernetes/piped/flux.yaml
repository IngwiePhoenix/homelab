apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: piped
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/piped
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: piped-helmrelease
      namespace: flux-system
  dependsOn:
    - name: traefik-internal
    - name: postgres-instance
