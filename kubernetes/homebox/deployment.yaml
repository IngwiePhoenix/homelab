apiVersion: apps/v1
kind: Deployment
metadata:
  name: homebox-app
  namespace: homebox
  labels:
    app: homebox
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homebox
  template:
    metadata:
      labels:
        app: homebox
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: app
          image: ghcr.io/sysadminsmedia/homebox:0.27.1-rootless # renovate: datasource=docker depName=ghcr.io/sysadminsmedia/homebox
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: homebox-cm
            - secretRef:
                name: homebox-env
            - secretRef:
                name: homebox-oidc-creds
          ports:
            - name: http
              containerPort: 7745
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homebox-data-pvc
