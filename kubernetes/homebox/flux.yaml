apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homebox
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  path: ./kubernetes/homebox
  prune: true
  dependsOn:
    - name: local-path-provisioner
    - name: traefik-ingress
    - name: voidauth
    - name: reloader
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: homebox-app
      namespace: homebox
  decryption:
    provider: sops
    secretRef:
      name: sops-age
