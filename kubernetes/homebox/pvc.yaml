apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homebox-data-pvc
  namespace: homebox
  labels:
    app: homebox
  annotations:
    local-path-provisioner/uid: "65532"
    local-path-provisioner/gid: "65532"
    local-path-provisioner/perm: "0700"
spec:
  storageClassName: local-bunker
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
