---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crowdsec-webui-bootstrap
  namespace: crowdsec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crowdsec-webui-bootstrap
  namespace: crowdsec
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crowdsec-webui-bootstrap
  namespace: crowdsec
subjects:
  - kind: ServiceAccount
    name: crowdsec-webui-bootstrap
    namespace: crowdsec
roleRef:
  kind: Role
  name: crowdsec-webui-bootstrap
  apiGroup: rbac.authorization.k8s.io
