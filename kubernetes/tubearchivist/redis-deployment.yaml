apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-stack-app
  namespace: tubearchivist
  labels:
    app: redis-stack
spec:
  selector:
    matchLabels:
      app: redis-stack
  template:
    metadata:
      labels:
        app: redis-stack
    spec:
      volumes:
        - name: redis-data-vol
          persistentVolumeClaim:
            claimName: redis-data-pvc
      containers:
        - name: app
          image: "redis/redis-stack-server:latest"
          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP
          volumeMounts:
            - mountPath: /data
              name: redis-data-vol
