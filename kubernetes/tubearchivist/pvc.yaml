apiVersion: v1
kind: PersistentVolume
metadata:
  name: ta-direct-pv
  namespace: tubearchivist
  labels:
    store: bunker
spec:
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: 10Ti
  nfs:
    server: 192.168.1.2
    path: /mnt/stash/YouTube
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ta-direct-pvc
  namespace: tubearchivist
spec:
  storageClassName: ""
  selector:
    matchLabels:
      store: bunker
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ta-cache-pvc-v2
  namespace: tubearchivist
spec:
  storageClassName: "nfs-bunker"
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
  namespace: tubearchivist
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data-pvc
  namespace: tubearchivist
spec:
  storageClassName: "nfs-bunker"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
