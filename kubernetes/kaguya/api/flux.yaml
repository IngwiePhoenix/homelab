apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: new-api
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  path: ./kubernetes/new-api
  prune: true
  wait: false
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: new-api-app
      namespace: new-api
  dependsOn:
    - name: postgres-instance
    - name: traefik-ingress
    - name: reloader
    - name: voidauth
  decryption:
    provider: sops
    secretRef:
      name: sops-age
