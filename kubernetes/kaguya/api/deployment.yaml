apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-api-app
  namespace: new-api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: new-api
  template:
    metadata:
      labels:
        app: new-api
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: new-api-pvc
      initContainers:
        - name: wait-for-postgres
          image: wait4x/wait4x:latest@sha256:aae91ea65a38117ac07c84c7e1122691ac91c3b60529edcb8fe62292d105d8ff
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: new-api-db-creds
          args:
            - postgres
            - postgres://$(LOGIN):$(PASSWORD)@$(HOST):$(PORT)/$(DATABASE)
      containers:
        - name: app
          image: calciumion/new-api:v1.0.0-rc.51
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: new-api-cm
            - secretRef:
                name: new-api-env
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: new-api-db-creds
                  key: HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: new-api-db-creds
                  key: PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: new-api-db-creds
                  key: LOGIN
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: new-api-db-creds
                  key: PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: new-api-db-creds
                  key: DATABASE
            - name: SQL_DSN
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
