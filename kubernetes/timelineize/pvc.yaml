apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: timelinize-data-pvc
  namespace: timelinize
  annotations:
    local-path-provisioner/uid: "1000"
    local-path-provisioner/gid: "1000"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-bunker
  resources:
    requests:
      # Timelinize recommends 10+ GB for semantic/AI features and thumbnail generation
      storage: 20Gi