apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng-app
  namespace: searxng
  labels:
    app: searxng
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: searxng
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: searxng
    spec:
      securityContext:
        runAsUser: 977
        runAsGroup: 977
        runAsNonRoot: true
        fsGroup: 977
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: searxng-config-pvc
        - name: cache
          emptyDir:
            sizeLimit: 512Mi
        - name: template
          configMap:
            name: searxng-settings
        - name: rendered
          emptyDir: {}
      initContainers:
        - name: wait-for-valkey
          image: wait4x/wait4x:latest@sha256:aae91ea65a38117ac07c84c7e1122691ac91c3b60529edcb8fe62292d105d8ff
          imagePullPolicy: IfNotPresent
          command: ["wait4x"]
          args: ["tcp", "cache-valkey:6379", "--timeout", "10m"]
        - name: render-settings
          image: nimasystems/envsubst:1.0.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              : "${BRAVE_API_KEY:?Missing BRAVE_API_KEY}"
              : "${SEARXNG_SECRET:?Missing SEARXNG_SECRET}"
              envsubst < /input/settings.yml > /output/settings.yml
              cat /input/limiter.toml > /output/limiter.toml
          envFrom:
            - secretRef:
                name: searxng-config-creds
          volumeMounts:
            - name: template
              mountPath: /input
              readOnly: true
            - name: rendered
              mountPath: /output
      containers:
        - name: app
          image: docker.io/searxng/searxng:2026.11.23-a7163d091
          imagePullPolicy: IfNotPresent
          env:
            - name: SEARXNG_BASE_URL
              value: https://search.birb.it/
            - name: SEARXNG_PUBLIC_INSTANCE
              value: "false"
            - name: SEARXNG_LIMITER
              value: "true"
            - name: SEARXNG_IMAGE_PROXY
              value: "true"
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-config-creds
                  key: SEARXNG_SECRET
            - name: VALKEY_HOST
              valueFrom:
                configMapKeyRef:
                  name: cache-connection
                  key: host
            - name: VALKEY_PORT
              valueFrom:
                configMapKeyRef:
                  name: cache-connection
                  key: port
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cache-auth
                  key: password
            - name: SEARXNG_VALKEY_URL
              value: "valkey://default:$(VALKEY_PASSWORD)@$(VALKEY_HOST):$(VALKEY_PORT)/0"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: rendered
              mountPath: /etc/searxng
            - name: cache
              mountPath: /var/cache/searxng
