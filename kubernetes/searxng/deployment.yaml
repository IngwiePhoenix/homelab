apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng-app
  namespace: searxng
  labels:
    app: searxng
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: searxng
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: searxng
    spec:
      securityContext:
        runAsUser: 977
        runAsGroup: 977
        runAsNonRoot: true
        fsGroup: 977
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-valkey
          image: wait4x/wait4x:latest@sha256:aae91ea65a38117ac07c84c7e1122691ac91c3b60529edcb8fe62292d105d8ff
          imagePullPolicy: IfNotPresent
          command:
            - wait4x
          args:
            - tcp
            - cache-valkey:6379
            - --timeout
            - 10m
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: searxng-config-pvc
        - name: cache
          emptyDir:
            sizeLimit: 512Mi
      containers:
        - name: app
          image: docker.io/searxng/searxng:2026.11.23-a7163d091
          imagePullPolicy: IfNotPresent
          env:
            - name: SEARXNG_BASE_URL
              value: https://search.birb.it/
            - name: SEARXNG_LIMITER
              value: "true"
            - name: SEARXNG_IMAGE_PROXY
              value: "true"
            - name: VALKEY_HOST
              valueFrom:
                configMapKeyRef:
                  name: cache-connection
                  key: host
            - name: VALKEY_PORT
              valueFrom:
                configMapKeyRef:
                  name: cache-connection
                  key: port
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cache-auth
                  key: password
            - name: SEARXNG_VALKEY_URL
              value: "valkey://default:$(VALKEY_PASSWORD)@$(VALKEY_HOST):$(VALKEY_PORT)/0"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
            - name: cache
              mountPath: /var/cache/searxng
