apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: searxng
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  path: ./kubernetes/searxng
  prune: true
  dependsOn:
    - name: local-path-provisioner
    - name: kro-rgd-valkey
    - name: traefik-ingress
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: searxng-app
      namespace: searxng
