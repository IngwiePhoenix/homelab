---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-external
  namespace: flux-system
spec:
  interval: 30m
  releaseName: traefik-external
  targetNamespace: traefik-external

  dependsOn:
    - name: traefik-internal

  chart:
    spec:
      chart: traefik
      version: "42.3.1"
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: traefik-helmrepo
        namespace: flux-system

  # CRDs are already installed and managed by traefik-internal.
  install:
    crds: Skip
  upgrade:
    crds: Skip

  values:
    deployment:
      kind: DaemonSet

    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-external

    providers:
      kubernetesCRD:
        enabled: true
        ingressClass: traefik-external
        allowCrossNamespace: false

        # Optional additional restriction:
        # Only watch namespaces that are allowed to have public routes.
        # namespaces:
        #   - voidauth
        #   - other-public-apps

      kubernetesIngress:
        enabled: false

    nodeSelector:
      homelab/location: external

    ingressRoute:
      dashboard:
        enabled: false

    ports:
      web:
        hostPort: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true

      websecure:
        hostPort: 443
        http:
          tls:
            enabled: true

    # We don't need a Kubernetes LoadBalancer Service here.
    # Traffic enters through the host ports.
    service:
      enabled: false
