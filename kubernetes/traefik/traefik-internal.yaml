apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal-helmrelease
  namespace: flux-system
spec:
  interval: 30m
  releaseName: traefik-internal
  targetNamespace: traefik-internal

  dependsOn:
    - name: metallb-helmrelease

  chart:
    spec:
      chart: traefik
      version: 42.3.2
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: traefik-helmrepo
        namespace: flux-system

  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace

  values:
    log:
      level: INFO
      format: json
    accessLog:
      enabled: true
      format: json
      fields:
        defaultMode: keep
        headers:
          defaultMode: drop

    deployment:
      enabled: true
      replicas: 2
      annotations:
        metallb.io/address-pool: home-lb-pool
        metallb.io/loadBalancerIPs: "10.1.0.15"

    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    providers:
      kubernetesCRD:
        enabled: true
        ingressClass: traefik-internal
        allowCrossNamespace: false
        allowExternalNameServices: true
      kubernetesIngress:
        enabled: true
        ingressClass: traefik-internal
        allowExternalNameServices: true
      kubernetesGateway:
        enabled: false

    ingressClass:
      enabled: true
      isDefaultClass: false
      name: "traefik-internal"

    nodeSelector:
      homelab/location: internal

    ingressRoute:
      dashboard:
        enabled: false

    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        http:
          tls:
            enabled: true

    service:
      enabled: true
      annotations:
        metallb.io/address-pool: home-lb-pool
        metallb.io/loadBalancerIPs: "10.1.0.15"
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Local
        sessionAffinity: None
        allocateLoadBalancerNodePorts: false

    # Avoids two Traefik instances to sit on the same node.

    # When a pod is scheduled, it plops a label on the respective node.

    # Because that label now exists, another pod is not put here.

    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
                app.kubernetes.io/instance: traefik-internal-traefik-internal
