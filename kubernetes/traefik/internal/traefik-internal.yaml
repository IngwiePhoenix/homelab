apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal-helmrelease
  namespace: flux-system
spec:
  interval: 30m
  releaseName: traefik-internal
  targetNamespace: traefik-internal
  dependsOn:
    - name: metallb-helmrelease
  chart:
    spec:
      chart: traefik
      version: 42.3.2
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: traefik-helmrepo
        namespace: flux-system
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: traefik-common-values
  values:
    deployment:
      enabled: true
      replicas: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    nodeSelector:
      homelab/location: internal
    providers:
      kubernetesIngress:
        enabled: true
        ingressClass: traefik-internal
        allowExternalNameServices: true
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-internal
    ingressRoute:
      dashboard:
        enabled: true
        entryPoints: ["websecure"]
        matchRule: "Host(`traefik.birb.it`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
        middlewares:
          - name: voidauth-tm
            namespace: voidauth
    ports:
      # Internal ports
      web:
        expose:
          default: true
      websecure:
        expose:
          default: true
    service:
      enabled: true
      annotations:
        # TODO: Migrate to new CIDR
        metallb.io/address-pool: home-lb-pool
        metallb.io/loadBalancerIPs: "10.1.0.15"
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Local
        sessionAffinity: None
        allocateLoadBalancerNodePorts: false
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
                app.kubernetes.io/instance: traefik-internal-traefik-internal
