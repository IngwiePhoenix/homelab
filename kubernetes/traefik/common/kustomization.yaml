apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helm-repo.yaml

# Shared values consumed by BOTH instances via HelmRelease valuesFrom.
# disableNameSuffixHash keeps the name stable; helm-controller re-renders
# when a referenced ConfigMap's content changes.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: traefik-common-values
    namespace: flux-system
    files:
      - values.yaml=common.values.yaml
