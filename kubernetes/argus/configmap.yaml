apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-cm
  namespace: argus
data:
  config.yml: |
    settings:
      auth:
        enabled: true
        session:
          secure_cookie: true
      data:
        database_file: data/argus.db
      web:
        listen_host: 0.0.0.0
        listen_port: 8080
        trusted_proxies:
          - 10.100.0.0/16
          - fd00:10:100::/108
