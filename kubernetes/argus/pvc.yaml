apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argus-pvc
  namespace: argus
  labels:
    app: argus
  annotations:
    local-path-provisioner/uid: "911"
    local-path-provisioner/gid: "911"
    local-path-provisioner/perm: "0700"
spec:
  storageClassName: local-bunker
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
