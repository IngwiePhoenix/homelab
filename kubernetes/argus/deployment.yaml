apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-app
  namespace: argus
  labels:
    app: argus
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: argus
  template:
    metadata:
      labels:
        app: argus
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 911
        runAsGroup: 911
        fsGroup: 911
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Argus edits config.yml through its UI, so seed it into the writable PVC
        # rather than mounting the ConfigMap over the live configuration file.
        - name: init-data
          image: releaseargus/argus:0.40.1 # renovate: datasource=docker depName=releaseargus/argus
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p /app/data
              if [ ! -f /app/config.yml ]; then
                cp /config/config.yml /app/config.yml
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app
            - name: config
              mountPath: /config
              readOnly: true
      containers:
        - name: app
          image: releaseargus/argus:0.40.1 # renovate: datasource=docker depName=releaseargus/argus
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app
          startupProbe:
            httpGet:
              path: /api/v1/healthcheck
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/healthcheck
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/healthcheck
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: argus-pvc
        - name: config
          configMap:
            name: argus-cm
