# kubernetes/root.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab-repo
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/IngwiePhoenix/homelab.git
  ref:
    branch: master
  ignore: |
    # Ignore everything except the kubernetes directory
    /*
    !/kubernetes/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  path: ./kubernetes
  prune: true
  wait: true
  timeout: 10m
