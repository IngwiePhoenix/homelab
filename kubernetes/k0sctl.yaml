  # TODO:
  #   The remote node is NOT YET ready to be deployed to.
  #   It currently runs singular Docker deployments and a Caddy proxy.
  #   I am leaving it's config here so I can upst `k0sctl apply` later and
  #   immediately add it to the cluster.
  #- ssh:
  #    # workboi-r
  #    address: 10.0.0.2
  #    user: root
  #    port: 22
  #  role: worker
  #  labels:
  #    apply:
  #      - homelab/location=external
  k0s:
    version: v1.37.2+k0s.0
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: Cluster
      metadata:
        name: k0s
      spec:
        api:
          k0sApiPort: 9443
          port: 6443
          # Point this to your OPNSense HAProxy/Keepalived VIP or Public DNS
          externalAddress: 10.1.0.1
          sans:
            - 10.1.0.1
            - k8s.birb.it
        installConfig:
          users:
            etcdUser: etcd
            kineUser: kube-apiserver
            konnectivityUser: konnectivity-server
            kubeAPIserverUser: kube-apiserver
            kubeSchedulerUser: kube-scheduler
        konnectivity:
          adminPort: 8133
          agentPort: 8132
        network:
          provider: calico
          podCIDR: 10.100.0.0/16
          serviceCIDR: 10.200.0.0/16
          #podCIDR: 172.30.0.0/16
          #serviceCIDR: 172.31.0.0/16
          dualStack:
            enabled: true
            #IPv6podCIDR: fd00:10:100::/108
            #IPv6serviceCIDR: fd00:10:200::/108
            IPv6podCIDR: fd00:10:100::/108
            IPv6serviceCIDR: fd00:10:200::/108
          calico:
            mode: bird
            #overlay: Always
            #vxlanPort: 4789
            ipAutodetectionMethod: kubernetes-internal-ip
            #envVars:
            #  FELIX_NFTABLESMODE: "Enabled"
          kubeProxy:
            disabled: false # Disabled so Cilium can take over with its eBPF replacement
            mode: nftables
        storage:
          type: etcd
        telemetry:
          enabled: true
        extensions:
          helm:
            #repositories:
            charts:
              - name: local-path-provisioner
                chartname: oci://ghcr.io/rancher/local-path-provisioner/charts/local-path-provisioner
                version: "0.0.37"
                namespace: local-path-storage
                values: |
                  tolerations:
                    - key: node-role.kubernetes.io/control-plane
                      operator: Exists
                      effect: NoSchedule

                  helperPod:
                    tolerations:
                      - key: node-role.kubernetes.io/control-plane
                        operator: Exists
                        effect: NoSchedule

                  storageClassConfigs:
                    local-bunker:
                      storageClass:
                        create: true
                        name: local-bunker
                        defaultClass: true
                        pathPattern: "{{ .PVC.Namespace }}/{{ .PVC.Name }}/"
                        userPattern: "{{ index .PVC.Annotations \"local-path-provisioner/uid\" }}"
                        groupPattern: "{{ index .PVC.Annotations \"local-path-provisioner/gid\" }}"
                        permPattern: "{{ index .PVC.Annotations \"local-path-provisioner/perm\" }}"
                      sharedFileSystemPath: /mnt/bunker/Services/k0s
                      nodePathMap: []
                    # Example for adding more later:
                    # nas-extended:
                    #   storageClass:
                    #     create: true
                    #     name: nas-extended
                    #     defaultClass: false
                    #     pathPattern: "{{ .PVC.Namespace }}/{{ .PVC.Name }}/"
                    #   sharedFileSystemPath: /mnt/nas/Services/k0s
                    #   nodePathMap: []
                  configmap:
                    setup: |-
                      #!/bin/sh
                      set -eu
                      mkdir -p "$VOL_DIR"
                      # Apply permissions if annotations were provided and rendered into these variables
                      if [ -n "$VOL_USER" ] || [ -n "$VOL_GROUP" ]; then
                        chown ${VOL_USER:-0}:${VOL_GROUP:-0} "$VOL_DIR"
                      fi
                      if [ -n "$VOL_PERM" ]; then
                        chmod "$VOL_PERM" "$VOL_DIR"
                      fi
                    teardown: |-
                      #!/bin/sh
                      set -eu
                      rm -rf "$VOL_DIR"
  options:
    wait:
      enabled: true
    drain:
      enabled: true
      gracePeriod: 2m0s
      timeout: 5m0s
      force: true
      ignoreDaemonSets: true
      deleteEmptyDirData: true
      podSelector: ""
      skipWaitForDeleteTimeout: 0s
    concurrency:
      limit: 30
      workerDisruptionPercent: 10
      uploads: 5
    evictTaint:
      enabled: false
      taint: k0sctl.k0sproject.io/evict=true
      effect: NoExecute
      controllerWorkers: false
