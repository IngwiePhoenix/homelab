apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: default-cluster
  namespace: mongodb
spec:
  members: 3
  type: ReplicaSet
  # renovate: datasource=docker depName=quay.io/mongodb/mongodb-community-server
  version: "9.0.8"
  featureCompatibilityVersion: "9.0"
  security:
    authentication:
      modes: ["SCRAM"]
  users: [] # Users are now declared via MongoDBUser CRDs elsewhere
  statefulSet:
    spec:
      volumeClaimTemplates:
        - metadata:
            name: data-volume
            annotations:
              local-path-provisioner/uid: "2000"
              local-path-provisioner/gid: "2000"
              local-path-provisioner/perm: "0770"
          spec:
            storageClassName: local-bunker
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
        - metadata:
            name: logs-volume
            annotations:
              local-path-provisioner/uid: "2000"
              local-path-provisioner/gid: "2000"
              local-path-provisioner/perm: "0770"
          spec:
            storageClassName: local-bunker
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 2Gi
      podTemplate:
        spec:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: shared-mongo-svc
                  topologyKey: kubernetes.io/hostname
