apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb-helmrelease
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: community-operator
      version: "0.10.0"
      sourceRef:
        kind: HelmRepository
        name: mongodb-helmrepo
  targetNamespace: mongodb-operator
  releaseName: mongodb-operator
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    database:
      namespace: mongodb
