
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb-mck-helmrelease
  namespace: flux-system
spec:
  interval: 5m

  chart:
    spec:
      chart: mongodb-kubernetes
      version: "1.15.0"
      sourceRef:
        kind: HelmRepository
        name: mongodb-helmrepo
        namespace: flux-system

  targetNamespace: mongodb-operator
  releaseName: mongodb-mck-operator

  install:
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  values:
    operator:
      # IMPORTANT: Must differ from the old operator's name.
      name: mongodb-mck-operator

      # Your database is in another namespace.
      watchNamespace: "*"

    community:
      mongodb:
        # Preserve the old chart's MongoDB image registry.
        repo: docker.io/mongodb
        name: mongodb-community-server
        imageType: ubi9-slim
