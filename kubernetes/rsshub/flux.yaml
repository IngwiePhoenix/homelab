apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rsshub
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  path: ./kubernetes/rsshub
  prune: true
  dependsOn:
    - name: local-path-provisioner
    - name: kro-rgd-valkey
    - name: traefik-ingress
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: rsshub-app
      namespace: rsshub
