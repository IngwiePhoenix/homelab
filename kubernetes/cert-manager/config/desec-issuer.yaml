apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-desec
spec:
  acme:
    email: ingwie@birb.it
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: desec-letsencrypt-account-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.pr0ton11.github.com
            solverName: desec
            config:
              apiKeySecretRef:
                key: api-token
                name: desec-api-token
