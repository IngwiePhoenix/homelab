apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-helmrelease
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: cm-lego
  releaseName: cm-lego
  chart:
    kind: HelmChart
    spec:
      chart: cert-manager-lego-webhook
      version: "1.6.2"
      sourceRef:
        kind: HelmRepository
        name: yxwuxuanl-helmrepo
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    certManager:
      namespace: cert-manager
