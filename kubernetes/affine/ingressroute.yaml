apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: affine-ir
  namespace: affine
spec:
  entryPoints:
    - websecure
  routes:
    # Admin UI: require VoidAuth
    - match: Host(`affine.birb.it`) && (Path(`/admin`) || PathPrefix(`/admin/`))
      kind: Rule
      priority: 100
      middlewares:
        - name: voidauth-tm
          namespace: voidauth
      services:
        - name: affine-svc
          port: web

    # Regular AFFiNE application: unchanged
    - match: Host(`affine.birb.it`)
      kind: Rule
      services:
        - name: affine-svc
          port: web
