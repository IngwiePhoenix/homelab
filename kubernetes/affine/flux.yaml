apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: affine
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  path: ./kubernetes/affine
  prune: true
  dependsOn:
    - name: local-path-provisioner
    - name: postgres-instance
    - name: valkey-operator
    - name: traefik-ingress
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: affine-app
      namespace: affine
