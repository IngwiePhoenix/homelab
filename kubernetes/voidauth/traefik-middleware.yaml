apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: voidauth-tm
  namespace: voidauth
spec:
  forwardAuth:
    address: http://voidauth-svc.voidauth:3000/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Name
      - Remote-Email
      - Remote-Groups
