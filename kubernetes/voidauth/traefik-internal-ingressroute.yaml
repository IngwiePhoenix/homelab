
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: voidauth
  namespace: voidauth
spec:
  ingressClassName: traefik-internal
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.birb.it`)
      kind: Rule
      services:
        - name: voidauth-svc
          port: 3000
  tls:
    secretName: voidauth-tls
