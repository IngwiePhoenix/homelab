apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: voidauth
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  path: ./kubernetes/voidauth
  prune: true
  wait: false # Fow now.
  dependsOn:
    - name: postgres-operator
    - name: cert-manager-issuers
    - name: traefik
    - name: reflector
    - name: reloader
    #- name: traefik-external
  #healthChecks:
