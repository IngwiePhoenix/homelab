apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ladder
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/ladder
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  healthChecks:
    - apiVersion: v1
      kind: Deployment
      name: ladder-app
      namespace: ladder
