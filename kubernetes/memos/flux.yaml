apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: memos
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  path: ./kubernetes/memos
  prune: true
  dependsOn:
    - name: local-path-provisioner
    - name: traefik-ingress
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: memos-app
      namespace: memos
