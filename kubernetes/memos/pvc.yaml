apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memos-pvc
  namespace: memos
  labels:
    app: memos
  annotations:
    local-path-provisioner/uid: "10001"
    local-path-provisioner/gid: "10001"
    local-path-provisioner/perm: "0700"
spec:
  storageClassName: local-bunker
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
