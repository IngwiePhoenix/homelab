apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: memos-ir
  namespace: memos
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`memos.birb.it`) && PathPrefix(`/api/v1/`)
      kind: Rule
      priority: 100
      services:
        - name: memos-svc
          port: compat
    - match: Host(`memos.birb.it`) && PathPrefix(`/o/r/`)
      kind: Rule
      priority: 100
      services:
        - name: memos-svc
          port: compat
    - match: Host(`memos.birb.it`)
      kind: Rule
      priority: 1
      services:
        - name: memos-svc
          port: web
