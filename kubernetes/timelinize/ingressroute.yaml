apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: timelinize-ir
  namespace: timelinize
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`time.birb.it`)
      kind: Rule
      middlewares:
        - name: voidauth-tm
          namespace: voidauth
      services:
        - name: timelinize-svc
          port: 12002
