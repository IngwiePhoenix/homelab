apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustical-pvc
  namespace: rustical
  annotations:
    local-path-provisioner/uid: "1000"
    local-path-provisioner/gid: "1000"
    local-path-provisioner/perm: "0700"
spec:
  storageClassName: local-bunker
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
