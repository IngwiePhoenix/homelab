# WARNING: RustiCal 0.20.1 unconditionally enables SQLite WAL. This PVC is
# backed by NFS, so do not deploy until using a patched RustiCal image that
# switches the journal mode to DELETE (or until upstream exposes a setting).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustical-pvc
  namespace: rustical
  annotations:
    local-path-provisioner/uid: "1000"
    local-path-provisioner/gid: "1000"
    local-path-provisioner/perm: "0700"
spec:
  storageClassName: local-bunker
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
