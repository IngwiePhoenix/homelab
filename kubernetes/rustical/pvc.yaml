# RustiCal 0.20.1 currently forces SQLite WAL even when backed by NFS.
# This deployment is intentionally allowed to run with that caveat; the pod is
# pinned to an internal node and the database should be backed up regularly.
# Revisit once upstream exposes a non-WAL journal mode.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustical-pvc
  namespace: rustical
  annotations:
    local-path-provisioner/uid: "1000"
    local-path-provisioner/gid: "1000"
    local-path-provisioner/perm: "0700"
spec:
  storageClassName: local-bunker
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
