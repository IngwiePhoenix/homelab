# Access SSH keys
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vaultwarden-ssh
spec:
  provider:
    webhook:
      url: 'http://127.0.0.1:8087/object/item/{{ .remoteRef.key }}'
      headers:
        Content-Type: application/json
      result:
        jsonPath: '$.data.sshKey.{{ .remoteRef.property }}'
