apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader-helmrelease
  namespace: flux-system
spec:
  interval: 30m
  releaseName: reloader
  targetNamespace: reloader
  chart:
    spec:
      chart: reloader
      version: 2.2.20
      sourceRef:
        kind: HelmRepository
        name: stakater-helmrepo
      interval: 1h
  install:
    createNamespace: true
  values:
    reloader:
      watchGlobally: true
      reloadStrategy: annotations
