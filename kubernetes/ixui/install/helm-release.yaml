apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ixui-helmrelease
  namespace: flux-system
spec:
  interval: 1h
  releaseName: ixui
  targetNamespace: ixui
  chart:
    spec:
      chart: ./kubernetes/ixui/chart
      version: "0.1.0"
      reconcileStrategy: Revision
      interval: 1h
      sourceRef:
        kind: GitRepository
        name: homelab-repo
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
