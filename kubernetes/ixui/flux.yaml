apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ixui-install
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  path: ./kubernetes/ixui/install
  prune: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: ixui-helmrelease
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ixui-config
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  path: ./kubernetes/ixui/config
  prune: true
  wait: true
  dependsOn:
    - name: ixui-install
    - name: traefik-internal
    - name: cert-manager-issuers
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: ixui-tls
      namespace: ixui
