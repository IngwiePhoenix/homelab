apiVersion: v1
kind: ConfigMap
metadata:
  name: ixui-nginx
  namespace: {{ .Release.Namespace }}
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;

      location = / {
        return 302 /ui/;
      }

      location ^~ /ui/ {
        try_files $uri $uri/ /ui/index.html;
      }

      # Keep the Incus API, event websocket and OIDC endpoints on the
      # public UI origin. The proxy authenticates TLS to Incus but does not
      # present an Incus client certificate or impersonate an administrator.
      location ^~ /1.0 {
        proxy_pass https://{{ .Values.incus.apiAddress }}:{{ .Values.incus.apiPort }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_ssl_server_name on;
        proxy_ssl_name {{ .Values.incus.tlsServerName }};
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/nginx/incus-ca/{{ .Values.incus.caSecretKey }};
      }

      location ^~ /oidc {
        proxy_pass https://{{ .Values.incus.apiAddress }}:{{ .Values.incus.apiPort }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_name {{ .Values.incus.tlsServerName }};
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/nginx/incus-ca/{{ .Values.incus.caSecretKey }};
      }

      location ^~ /documentation {
        proxy_pass https://{{ .Values.incus.apiAddress }}:{{ .Values.incus.apiPort }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_name {{ .Values.incus.tlsServerName }};
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/nginx/incus-ca/{{ .Values.incus.caSecretKey }};
      }
    }
