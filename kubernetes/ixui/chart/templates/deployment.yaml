apiVersion: apps/v1
kind: Deployment
metadata:
  name: ixui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ixui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ixui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ixui
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 101
      initContainers:
        - name: download-ixui
          image: "{{ .Values.downloader.repository }}:{{ .Values.downloader.tag }}"
          imagePullPolicy: {{ .Values.downloader.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              apk add --no-cache ca-certificates curl unzip
              curl --fail --location --retry 5 --retry-delay 2 \
                "{{ .Values.ixui.archiveUrl }}" --output /tmp/ixui.zip
              printf '%s  %s\n' "{{ .Values.ixui.archiveSha256 }}" /tmp/ixui.zip | sha256sum -c -
              mkdir -p /usr/share/nginx/html/ui
              unzip -q -o /tmp/ixui.zip -d /usr/share/nginx/html/ui
          volumeMounts:
            - name: ui-assets
              mountPath: /usr/share/nginx/html/ui
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            runAsGroup: 0
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ui/
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ui/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - name: ui-assets
              mountPath: /usr/share/nginx/html/ui
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: incus-api-ca
              mountPath: /etc/nginx/incus-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ui-assets
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: ixui-nginx
        - name: incus-api-ca
          secret:
            secretName: {{ .Values.incus.caSecretName }}
            items:
              - key: {{ .Values.incus.caSecretKey }}
                path: {{ .Values.incus.caSecretKey }}
        - name: tmp
          emptyDir: {}
