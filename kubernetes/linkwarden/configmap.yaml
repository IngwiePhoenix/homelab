apiVersion: v1
kind: ConfigMap
metadata:
  name: linkwarden-cm
  namespace: linkwarden
data:
  NEXTAUTH_URL: "https://links.birb.it/api/v1/auth"
  STORAGE_FOLDER: "/data/data"
  NEXT_PUBLIC_OIDC_ENABLED: "true"
  OIDC_CUSTOM_NAME: "VoidAuth"
  OIDC_WELLKNOWN_URL: "https://auth.birb.it/oidc/.well-known/openid-configuration"
  OIDC_SCOPES: "openid email profile"
  NEXT_PUBLIC_CREDENTIALS_ENABLED: "false"
  NEXT_PUBLIC_DISABLE_REGISTRATION: "true"
