apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/local-path-provisioner
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  healthChecks:
    - apiVersion: storage.k8s.io/v1
      kind: StorageClass
      name: local-bunker
