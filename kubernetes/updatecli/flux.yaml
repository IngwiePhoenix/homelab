apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: updatecli
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/updatecli
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  decryption:
    provider: sops
    secretRef:
      name: sops-age
