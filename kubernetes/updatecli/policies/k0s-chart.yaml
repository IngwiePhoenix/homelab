{{- define "scm" }}
scms:
  homelab:
    kind: github
    spec:
      owner: '{{ requiredEnv "UPDATECLI_GITHUB_OWNER" }}'
      repository: '{{ requiredEnv "UPDATECLI_GITHUB_REPOSITORY" }}'
      branch: '{{ requiredEnv "UPDATECLI_GITHUB_BRANCH" }}'
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      user: updatecli-bot
      email: updatecli-bot@example.invalid
      workingbranch: true
      force: false
{{- end }}

{{- define "patchAction" }}
actions:
  pr:
    kind: github/pullrequest
    scmid: homelab
    title: 'chore({{ .component }}): patch updates'
    spec:
      labels:
        - dependencies
      merge:
        strategy: auto
      mergemethod: squash
{{- end }}

{{- define "manualAction" }}
actions:
  pr:
    kind: github/pullrequest
    scmid: homelab
    title: 'chore({{ .component }}): dependency upgrades'
    spec:
      labels:
        - dependencies
{{- end }}

# ----------------------------------------------------------
# Patch updates
# ----------------------------------------------------------

{{ template "scm" . }}
{{ template "patchAction" . }}

name: '{{ .component }}: patch updates'
pipelineid: '{{ .component }}-patch'

sources:
  currentVersion:
    kind: yaml
    scmid: homelab
    spec:
      file: '{{ .manifest }}'
      key: $.spec.version

  patchRange:
    kind: shell
    spec:
      command: |
        version='{{ source "currentVersion" }}'
        version=${version#v}
        version=${version%%+*}
        version=${version%%-*}

        major=${version%%.*}
        rest=${version#*.}
        minor=${rest%%.*}

        printf '~%s.%s' "$major" "$minor"

  chartVersion:
    kind: helmchart
    spec:
      url: '{{ .chartRepository }}'
      name: '{{ .chartName }}'
      versionfilter:
        kind: semver
        pattern: '{{ source "patchRange" }}'

conditions:
  chartIdentity:
    kind: yaml
    scmid: homelab
    disablesourceinput: true
    spec:
      file: '{{ .manifest }}'
      key: $.spec.chartName
      value: '{{ .chartReference }}'

targets:
  chartVersion:
    name: "Update k0s Flux bootstrap chart version"
    kind: yaml
    scmid: homelab
    sourceid: chartVersion
    spec:
      file: '{{ .manifest }}'
      key: $.spec.version

---
# ----------------------------------------------------------
# Minor updates
# ----------------------------------------------------------

{{ template "scm" . }}
{{ template "manualAction" . }}

name: '{{ .component }}: minor updates'
pipelineid: '{{ .component }}-upgrades'

sources:
  currentVersion:
    kind: yaml
    scmid: homelab
    spec:
      file: '{{ .manifest }}'
      key: $.spec.version

  minorRange:
    kind: shell
    spec:
      command: |
        version='{{ source "currentVersion" }}'
        version=${version#v}
        version=${version%%+*}
        version=${version%%-*}

        major=${version%%.*}
        rest=${version#*.}
        minor=${rest%%.*}

        nextMinor=$((minor + 1))
        nextMajor=$((major + 1))

        printf '>= %s.%s.0 < %s.0.0' \
          "$major" "$nextMinor" "$nextMajor"

  chartVersion:
    kind: helmchart
    spec:
      url: '{{ .chartRepository }}'
      name: '{{ .chartName }}'
      versionfilter:
        kind: semver
        pattern: '{{ source "minorRange" }}'

conditions:
  chartIdentity:
    kind: yaml
    scmid: homelab
    disablesourceinput: true
    spec:
      file: '{{ .manifest }}'
      key: $.spec.chartName
      value: '{{ .chartReference }}'

targets:
  chartVersion:
    name: "Update k0s Flux bootstrap chart version"
    kind: yaml
    scmid: homelab
    sourceid: chartVersion
    spec:
      file: '{{ .manifest }}'
      key: $.spec.version

---
# ----------------------------------------------------------
# Major updates
# ----------------------------------------------------------

{{ template "scm" . }}
{{ template "manualAction" . }}

name: '{{ .component }}: major updates'
pipelineid: '{{ .component }}-upgrades'

sources:
  currentVersion:
    kind: yaml
    scmid: homelab
    spec:
      file: '{{ .manifest }}'
      key: $.spec.version

  majorRange:
    kind: shell
    spec:
      command: |
        version='{{ source "currentVersion" }}'
        version=${version#v}
        version=${version%%+*}
        version=${version%%-*}

        major=${version%%.*}
        nextMajor=$((major + 1))

        printf '>= %s.0.0' "$nextMajor"

  chartVersion:
    kind: helmchart
    spec:
      url: '{{ .chartRepository }}'
      name: '{{ .chartName }}'
      versionfilter:
        kind: semver
        pattern: '{{ source "majorRange" }}'

conditions:
  chartIdentity:
    kind: yaml
    scmid: homelab
    disablesourceinput: true
    spec:
      file: '{{ .manifest }}'
      key: $.spec.chartName
      value: '{{ .chartReference }}'

targets:
  chartVersion:
    name: "Update k0s Flux bootstrap chart version"
    kind: yaml
    scmid: homelab
    sourceid: chartVersion
    spec:
      file: '{{ .manifest }}'
      key: $.spec.version