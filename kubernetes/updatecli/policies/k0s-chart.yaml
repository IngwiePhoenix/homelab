
{{- define "scm" }}
scms:
  homelab:
    kind: github
    spec:
      owner: '{{ requiredEnv "UPDATECLI_GITHUB_OWNER" }}'
      repository: '{{ requiredEnv "UPDATECLI_GITHUB_REPOSITORY" }}'
      branch: '{{ requiredEnv "UPDATECLI_GITHUB_BRANCH" }}'
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      user: updatecli-bot
      email: updatecli-bot@example.invalid
      workingbranch: true
      force: false
{{- end }}

{{- define "patchAction" }}
actions:
  pr:
    kind: github/pullrequest
    scmid: homelab
    title: 'chore({{ .component }}): patch updates'
    spec:
      labels:
        - dependencies
      merge:
        strategy: auto
      mergemethod: squash
{{- end }}

{{- define "manualAction" }}
actions:
  pr:
    kind: github/pullrequest
    scmid: homelab
    title: 'chore({{ .component }}): dependency upgrades'
    spec:
      labels:
        - dependencies
{{- end }}

# ----------------------------------------------------------
# Patch updates
# ----------------------------------------------------------

{{ template "scm" . }}
{{ template "patchAction" . }}

name: '{{ .component }}: patch updates'
pipelineid: '{{ .component }}-patch'

sources:
  chartVersion:
    kind: helmchart
    spec:
      url: '{{ .chartRepository }}'
      name: '{{ .chartName }}'
      versionfilter:
        kind: semver
        pattern: '{{ $v := semver (source "currentVersion") }}~{{ $v.Major }}.{{ $v.Minor }}'
  currentVersion:
    kind: yaml
    scmid: homelab
    spec:
      file: '{{ .manifest }}'
      key: $.spec.version

conditions:
  chartIdentity:
    kind: yaml
    scmid: homelab
    spec:
      file: '{{ .manifest }}'
      key: $.spec.chartName
      value: '{{ .chartReference }}'

targets:
  chartVersion:
    kind: yaml
    scmid: homelab
    sourceid: chartVersion
    spec:
      file: '{{ .manifest }}'
      key: $.spec.version

---
# ----------------------------------------------------------
# Minor updates
# ----------------------------------------------------------

{{ template "scm" . }}
{{ template "manualAction" . }}

name: '{{ .component }}: minor updates'
pipelineid: '{{ .component }}-upgrades'

sources:
  chartVersion:
    kind: helmchart
    spec:
      url: '{{ .chartRepository }}'
      name: '{{ .chartName }}'
      versionfilter:
        kind: semver
        pattern: '{{ $v := semver (source "currentVersion") }}>= {{ $v.Major }}.{{ add1 $v.Minor }}.0 < {{ add1 $v.Major }}.0.0'
  currentVersion:
    kind: yaml
    scmid: homelab
    spec:
      file: '{{ .manifest }}'
      key: $.spec.version

conditions:
  chartIdentity:
    kind: yaml
    scmid: homelab
    spec:
      file: '{{ .manifest }}'
      key: $.spec.chartName
      value: '{{ .chartReference }}'

targets:
  chartVersion:
    kind: yaml
    scmid: homelab
    sourceid: chartVersion
    spec:
      file: '{{ .manifest }}'
      key: $.spec.version

