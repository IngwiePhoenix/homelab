apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton-install
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  path: ./kubernetes/tekton/install
  prune: true
  wait: true # for now.
  #healthChecks:
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton-config
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  path: ./kubernetes/tekton/config
  prune: true
  dependsOn:
    - name: tekton-install
  healthChecks:
    - apiVersion: operator.tekton.dev/v1alpha1
      kind: TektonConfig
      name: config
    - apiVersion: v1
      kind: Namespace
      name: tekton
