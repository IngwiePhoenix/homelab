apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rclone-csi-helmrelease
  namespace: flux-system
spec:
  interval: 30m

  releaseName: rclone-csi
  targetNamespace: rclone-csi

  install:
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  chartRef:
    kind: OCIRepository
    name: rclone-csi-helmrepo
    namespace: flux-system

  values:
    # Important for k0s!
    kubeletDir: /var/lib/k0s/kubelet
    node:
      cache:
        enabled: true
        hostPath: /var/lib/rclone-cache
        mountPath: /var/lib/rclone-cache
