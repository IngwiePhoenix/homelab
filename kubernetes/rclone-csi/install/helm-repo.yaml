apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rclone-csi-helmrepo
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/veloxpack/charts/csi-driver-rclone
  ref:
    tag: "0.5.1"
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
