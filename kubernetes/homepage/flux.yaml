apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  path: ./kubernetes/homepage
  prune: true
  dependsOn:
    - name: voidauth
    - name: traefik-ingress
    - name: reloader
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: homepage-app
      namespace: homepage
  decryption:
    provider: sops
    secretRef:
      name: sops-age
