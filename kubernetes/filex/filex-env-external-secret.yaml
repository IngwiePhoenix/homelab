apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filex-env
  namespace: filex
spec:
  refreshPolicy: CreatedOnce
  target:
    name: filex-env
    creationPolicy: Orphan
    immutable: true
    template:
      type: Opaque
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: filex-secret-key-generator
