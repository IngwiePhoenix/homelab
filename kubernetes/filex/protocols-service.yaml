apiVersion: v1
kind: Service
metadata:
  name: filex-protocols-svc
  namespace: filex
  annotations:
    projectcalico.org/loadBalancerIPs: '["10.10.10.11"]'
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: filex
    app.kubernetes.io/instance: filex
  ports:
    - name: sftp
      port: 2022
      targetPort: 2022
      protocol: TCP
    - name: nfs
      port: 2049
      targetPort: 2049
      protocol: TCP
