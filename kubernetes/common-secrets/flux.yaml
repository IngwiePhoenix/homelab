apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: common-secrets
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  path: ./kubernetes/common-secrets
  prune: true
  wait: true
  dependsOn:
    - name: reflector
  decryption:
    provider: sops
    secretRef:
      name: sops-age