apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoprism-app
  namespace: photoprism
  labels:
    app: photoprism
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: photoprism
  template:
    metadata:
      labels:
        app: photoprism
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      volumes:
        - name: originals
          hostPath:
            path: "/mnt/bunker/Photos/Photo Library"
            type: Directory
        - name: import
          hostPath:
            path: "/mnt/bunker/Photos/Photo Import"
            type: Directory
        - name: storage
          hostPath:
            path: "/mnt/bunker/Photos/Photoprism Cache"
            type: Directory
      initContainers:
        - name: wait-for-mariadb
          image: wait4x/wait4x:latest@sha256:aae91ea65a38117ac07c84c7e1122691ac91c3b60529edcb8fe62292d105d8ff
          imagePullPolicy: IfNotPresent
          command:
            - wait4x
          args:
            - tcp
            - mariadb-primary.mariadb.svc.cluster.local:3306
            - --timeout
            - 10m
        # Restore the selected historical MariaDB dump exactly once. PhotoPrism's
        # restore command also applies the schema migrations shipped in this image.
        - name: restore-mariadb-backup
          image: photoprism/photoprism:261029-ce
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              marker="/photoprism/storage/.photoprism-mariadb-restore-20240614-complete"
              dump="/photoprism/storage/backups/mysql/2024-06-14.sql"

              if [ -f "$marker" ]; then
                echo "PhotoPrism MariaDB restore already completed."
                exit 0
              fi

              if [ ! -s "$dump" ]; then
                echo "Required PhotoPrism MariaDB backup is missing or empty: $dump" >&2
                exit 1
              fi

              echo "Restoring PhotoPrism database and album metadata from $dump"
              /opt/photoprism/bin/photoprism restore --albums --database --force "$dump"

              touch "$marker"
              echo "PhotoPrism MariaDB restore completed."
          envFrom:
            - configMapRef:
                name: photoprism-cm
          env:
            - name: PHOTOPRISM_DATABASE_SERVER
              valueFrom:
                secretKeyRef:
                  name: photoprism-mariadb-creds
                  key: PHOTOPRISM_DATABASE_SERVER
            - name: PHOTOPRISM_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: photoprism-mariadb-creds
                  key: DB
            - name: PHOTOPRISM_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: photoprism-mariadb-creds
                  key: USER
            - name: PHOTOPRISM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoprism-mariadb-creds
                  key: PASSWORD
          volumeMounts:
            - name: storage
              mountPath: /photoprism/storage
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      containers:
        - name: app
          image: photoprism/photoprism:261029-ce
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: photoprism-cm
            - secretRef:
                name: photoprism-oidc-creds
                optional: true
          env:
            - name: PHOTOPRISM_DATABASE_SERVER
              valueFrom:
                secretKeyRef:
                  name: photoprism-mariadb-creds
                  key: PHOTOPRISM_DATABASE_SERVER
            - name: PHOTOPRISM_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: photoprism-mariadb-creds
                  key: DB
            - name: PHOTOPRISM_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: photoprism-mariadb-creds
                  key: USER
            - name: PHOTOPRISM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoprism-mariadb-creds
                  key: PASSWORD
          ports:
            - name: http
              containerPort: 2342
              protocol: TCP
          volumeMounts:
            - name: originals
              mountPath: /photoprism/originals
            - name: import
              mountPath: /photoprism/import
            - name: storage
              mountPath: /photoprism/storage
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
