apiVersion: postgresql.easymile.com/v1alpha1
kind: PostgresqlDatabase
metadata:
  name: photoprism-db
  namespace: photoprism
spec:
  engineConfiguration:
    name: default-cluster-instance
    namespace: postgres
  database: photoprism
  masterRole: photoprism-role
  # Keep the database if this GitOps object is ever removed accidentally.
  dropOnDelete: false
  waitLinkedResourcesDeletion: true
---
apiVersion: postgresql.easymile.com/v1alpha1
kind: PostgresqlUserRole
metadata:
  name: photoprism-db-user
  namespace: photoprism
spec:
  mode: MANAGED
  rolePrefix: photoprism
  privileges:
    - privilege: OWNER
      database:
        name: photoprism-db
      generatedSecretName: photoprism-db-creds
