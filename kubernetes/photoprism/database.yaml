apiVersion: kinda.rocks/v1beta1
kind: Database
metadata:
  name: photoprism-db
  namespace: photoprism
spec:
  # DB Operator connects through the registered MariaDB instance and its
  # operator-managed primary Service.
  instance: mariadb
  secretName: photoprism-mariadb-creds
  # Keep the MariaDB database and user if this CR is ever removed.
  deletionProtected: true
  credentials:
    templates:
      - name: PHOTOPRISM_DATABASE_SERVER
        secret: true
        template: "{{ .Hostname }}:{{ .Port }}"
