apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: photoprism
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  path: ./kubernetes/photoprism
  prune: true
  dependsOn:
    - name: db-operator-instance
    - name: traefik-ingress
    - name: voidauth
    - name: reloader
  healthChecks:
    - apiVersion: kinda.rocks/v1beta1
      kind: Database
      name: photoprism
      namespace: photoprism
    - apiVersion: apps/v1
      kind: Deployment
      name: photoprism-app
      namespace: photoprism
  healthCheckExprs:
    - apiVersion: kinda.rocks/v1beta1
      kind: Database
      current: >-
        has(status.status) && status.status == true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
