apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey-operator-helmrelease
  namespace: flux-system
spec:
  interval: 30m
  releaseName: valkey-operator
  targetNamespace: valkey-operator

  install:
    createNamespace: true
    crds: Create

  upgrade:
    crds: CreateReplace

  chart:
    spec:
      chart: valkey-operator
      version: "0.1.31"
      sourceRef:
        kind: HelmRepository
        name: valkey-operator-helmrepo
        namespace: flux-system
      interval: 1h

  values:
    fullnameOverride: valkey-operator

    replicaCount: 2

    nodeSelector:
      homelab/location: internal

    pdb:
      enabled: true
      minAvailable: "1"
