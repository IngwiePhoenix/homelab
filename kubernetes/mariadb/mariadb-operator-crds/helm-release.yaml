apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator-crds-helmrelease
  namespace: flux-system
spec:
  interval: 30m
  releaseName: mariadb-operator-crds
  targetNamespace: mariadb-operator
  timeout: 10m

  chart:
    spec:
      chart: mariadb-operator-crds
      version: 26.10.1
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator-helmrepo
        namespace: flux-system
      interval: 1h

  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
