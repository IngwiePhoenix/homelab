apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator-helmrelease
  namespace: flux-system
spec:
  interval: 30m
  releaseName: mariadb-operator
  targetNamespace: mariadb-operator
  timeout: 10m

  chart:
    spec:
      chart: mariadb-operator
      version: 26.10.1
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator-helmrepo
        namespace: flux-system
      interval: 1h

  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3

  values:
    # CRDs are installed and upgraded by the separate CRD HelmRelease.
    crds:
      enabled: false

    # Keep the controller's watch scope limited to the database namespace.
    currentNamespaceOnly: false
    extraEnv:
      - name: WATCH_NAMESPACE
        value: mariadb

    nodeSelector:
      homelab/location: internal
    webhook:
      nodeSelector:
        homelab/location: internal
    certController:
      nodeSelector:
        homelab/location: internal
