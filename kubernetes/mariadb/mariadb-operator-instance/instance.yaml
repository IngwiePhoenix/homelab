apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb
  namespace: mariadb
spec:
  image: mariadb:11.8.9
  imagePullPolicy: IfNotPresent
  replicas: 2

  myCnf: |
    [mariadb]
    innodb_linux_aio=aio

  # Generate and retain the root credential in this namespace. DB Operator
  # consumes this Secret through its cluster-scoped DbInstance resource.
  rootPasswordSecretKeyRef:
    name: mariadb-root-creds
    key: password
    generate: true

  # Both database pods must run on nodes explicitly labelled as internal.
  nodeSelector:
    homelab/location: internal

  # Keep the primary and replica on separate physical Kubernetes nodes.
  # This is required anti-affinity, not a best-effort preference.
  affinity:
    antiAffinityEnabled: true

  # One primary plus one replica. Semi-sync is enabled by default; keep it
  # explicit so a transaction is acknowledged by the replica before commit.
  replication:
    enabled: true
    semiSyncEnabled: true
    primary:
      autoFailover: true

  storage:
    volumeClaimTemplate:
      metadata:
        annotations:
          local-path-provisioner/uid: "999"
          local-path-provisioner/gid: "999"
          local-path-provisioner/perm: "0700"
      accessModes:
        - ReadWriteOnce
      storageClassName: local-bunker
      resources:
        requests:
          storage: 10Gi
    pvcRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
