apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mariadb-operator-crds
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  path: ./kubernetes/mariadb/mariadb-operator-crds
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mariadb-operator-crds-helmrelease
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mariadb-operator
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  path: ./kubernetes/mariadb/mariadb-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  dependsOn:
    - name: mariadb-operator-crds
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mariadb-operator-helmrelease
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mariadb-operator-instance
  namespace: flux-system
spec:
  targetNamespace: mariadb
  interval: 10m
  timeout: 20m
  path: ./kubernetes/mariadb/mariadb-operator-instance
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  dependsOn:
    - name: mariadb-operator
    - name: local-path-provisioner
  healthChecks:
    - apiVersion: k8s.mariadb.com/v1alpha1
      kind: MariaDB
      name: mariadb
      namespace: mariadb
  healthCheckExprs:
    - apiVersion: k8s.mariadb.com/v1alpha1
      kind: MariaDB
      current: >
        has(status.conditions) &&
        status.conditions.exists(c,
          c.type == 'Ready' && c.status == 'True'
        )
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: db-operator
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  path: ./kubernetes/mariadb/db-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  dependsOn:
    - name: mariadb-operator
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: db-operator-helmrelease
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: db-operator-instance
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  path: ./kubernetes/mariadb/db-operator-instance
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  dependsOn:
    - name: mariadb-operator-instance
    - name: db-operator
  healthChecks:
    - apiVersion: kinda.rocks/v1
      kind: DbInstance
      name: mariadb
  healthCheckExprs:
    - apiVersion: kinda.rocks/v1
      kind: DbInstance
      current: >
        has(status.ready) && status.ready
      failed: >
        has(status.conditions) &&
        status.conditions.exists(c,
          c.type == 'Degraded' && c.status == 'True'
        )
