apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: db-operator-helmrelease
  namespace: flux-system
spec:
  interval: 30m
  releaseName: db-operator
  targetNamespace: db-operator
  timeout: 10m

  chart:
    spec:
      chart: db-operator
      version: 4.1.0
      sourceRef:
        kind: HelmRepository
        name: db-operator-helmrepo
        namespace: flux-system
      interval: 1h

  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3

  values:
    nodeSelector:
      homelab/location: internal

    crds:
      install: true
      keep: true

    controller:
      args:
        reconcileInterval: 60s
        # Database and DbUser resources will live in their respective app namespaces.
        # An empty value deliberately enables cluster-wide watches.
        watchNamespaces: ""
        checkForChanges: false
