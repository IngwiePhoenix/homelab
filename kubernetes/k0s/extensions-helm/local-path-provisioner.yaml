apiVersion: helm.k0sproject.io/v1beta1
kind: Chart
metadata:
  name: local-path-provisioner
  namespace: kube-system
spec:
  chartName: oci://ghcr.io/rancher/local-path-provisioner/charts/local-path-provisioner
  version: "0.0.37"
  namespace: local-path-provisioner
  values: |
    storageClassConfigs:
      local-bunker:
        storageClass:
          create: true
          name: local-bunker
          defaultClass: true
          pathPattern: "{{ .PVC.Namespace }}/{{ .PVC.Name }}/"
          userPattern: "{{ index .PVC.Annotations \"local-path-provisioner/uid\" }}"
          groupPattern: "{{ index .PVC.Annotations \"local-path-provisioner/gid\" }}"
          permPattern: "{{ index .PVC.Annotations \"local-path-provisioner/perm\" }}"
        sharedFileSystemPath: /mnt/bunker/Services/k0s
        nodePathMap: []
      # Example for adding more later:
      # nas-extended:
      #   storageClass:
      #     create: true
      #     name: nas-extended
      #     defaultClass: false
      #     pathPattern: "{{ .PVC.Namespace }}/{{ .PVC.Name }}/"
      #   sharedFileSystemPath: /mnt/nas/Services/k0s
      #   nodePathMap: []

    configmap:
      setup: |-
        #!/bin/sh
        set -eu

        # Recover variables that k0sctl expanded prematurely.
        if [ -z "$VOL_DIR" ]; then VOL_DIR="$$VOL_DIR"; fi
        if [ -z "$VOL_USER" ]; then VOL_USER="$$VOL_USER"; fi
        if [ -z "$VOL_GROUP" ]; then VOL_GROUP="$$VOL_GROUP"; fi
        if [ -z "$VOL_PERM" ]; then VOL_PERM="$$VOL_PERM"; fi

        # VOL_DIR is mandatory.
        if [ -z "$$VOL_DIR" ]; then
          echo "ERROR: VOL_DIR is empty; refusing to create volume." >&2
          exit 1
        fi

        mkdir -p "$$VOL_DIR"

        # Apply ownership if either UID or GID was provided.
        if [ -n "$$VOL_USER" ] || [ -n "$$VOL_GROUP" ]; then
          if [ -z "$$VOL_USER" ]; then VOL_USER=0; fi
          if [ -z "$$VOL_GROUP" ]; then VOL_GROUP=0; fi
          chown "$$VOL_USER:$$VOL_GROUP" "$$VOL_DIR"
        fi

        # Apply permissions if provided.
        if [ -n "$$VOL_PERM" ]; then
          chmod "$$VOL_PERM" "$$VOL_DIR"
        fi

      teardown: |-
        #!/bin/sh
        set -eu

        # Recover VOL_DIR if k0sctl expanded it prematurely.
        if [ -z "$VOL_DIR" ]; then VOL_DIR="$$VOL_DIR"; fi

        # Never attempt to remove an empty or root directory.
        if [ -z "$$VOL_DIR" ] || [ "$$VOL_DIR" = "/" ]; then
          echo "ERROR: Invalid VOL_DIR; refusing to remove volume." >&2
          exit 1
        fi

        rm -rf -- "$$VOL_DIR"

    # Not neccessarily needed - but a good safety-net.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    helperPod:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
