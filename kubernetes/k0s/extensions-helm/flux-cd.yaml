apiVersion: helm.k0sproject.io/v1beta1
kind: Chart
metadata:
  name: flux-cd
  namespace: kube-system
spec:
  chartName: oci://ghcr.io/fluxcd-community/charts/flux2
  version: "2.20.0"
  namespace: flux-system
  releaseName: flux-system
  timeout: 5m
  #forceUpgrade: false
  values: |
    # Enable CRD migrations for the future. Could be useful.
    crds:
      migration:
        enabled: true

    kustomizeController:
      container:
        additionalArgs:
          - --requeue-dependency=2s

    helmController:
      container:
        additionalArgs:
          - --requeue-dependency=2s

    imageAutomationController:
      create: false

    imageReflectionController:
      create: false