apiVersion: k0s.k0sproject.io/v1beta1
kind: ClusterConfig
metadata:
  name: k0s
  namespace: kube-system
spec:
  api:
    k0sApiPort: 9443
    port: 6443
    externalAddress: 10.1.1.100
    sans:
      - 10.1.1.100
      - k8s.birb.it
  installConfig:
    users:
      etcdUser: etcd
      kineUser: kube-apiserver
      konnectivityUser: konnectivity-server
      kubeAPIserverUser: kube-apiserver
      kubeSchedulerUser: kube-scheduler
  konnectivity:
    adminPort: 8133
    agentPort: 8132
  network:
    provider: calico
    podCIDR: 10.100.0.0/16
    serviceCIDR: 10.200.0.0/16
    dualStack:
      enabled: true
      IPv6podCIDR: fd00:10:100::/108
      IPv6serviceCIDR: fd00:10:200::/108
    calico:
      mode: bird
      ipAutodetectionMethod: kubernetes-internal-ip
      envVars:
        CALICO_IPV6POOL_VXLAN: "Always"
        IP6_AUTODETECTION_METHOD: "can-reach=fd42:42:42::1"
    kubeProxy:
      disabled: false
      mode: nftables
  storage:
    type: etcd
  telemetry:
    enabled: true
