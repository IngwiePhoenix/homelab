apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clustersecret-operator-helmrelease
  namespace: flux-system
spec:
  interval: 30m
  releaseName: clustersecret-operator
  targetNamespace: clustersecret-operator

  install:
    createNamespace: true
    crds: Create

  upgrade:
    crds: CreateReplace

  chart:
    spec:
      chart: clustersecret-operator
      version: "0.3.100"
      sourceRef:
        kind: HelmRepository
        name: clustersecret-operator-helmrepo
        namespace: flux-system
      interval: 1h

  values:
    global:
      nodeSelector:
        homelab/location: internal
