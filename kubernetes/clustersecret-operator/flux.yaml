apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clustersecret-operator
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/clustersecret-operator
  prune: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: clustersecret-operator-helmrelease
      namespace: flux-system
