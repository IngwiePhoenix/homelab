apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Let Flux take ownership of the dynamic config from day 2 onwards
  - k0s/cluster.yaml
  - k0s/extensions-helm/flux-cd.yaml

  # Core
  - local-path-provisioner/flux.yaml

  # Base:
  - updatecli/flux.yaml
  - cert-manager/flux.yaml
  - metallb/flux.yaml
  - reflector/flux.yaml
  - reloader/flux.yaml
  - traefik/flux.yaml
  - postgres/flux.yaml
  - common-secrets/flux.yaml

  # Apps
  - voidauth/flux.yaml
