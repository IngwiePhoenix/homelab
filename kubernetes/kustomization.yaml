apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Let Flux take ownership of the dynamic config from day 2 onwards
  - k0s/cluster.yaml
  - k0s/extensions-helm/flux-cd.yaml
  - calico-config/flux.yaml

  # Core
  - local-path-provisioner/flux.yaml
  - rclone-csi/flux.yaml

  # Base:
  - renovate-operator/flux.yaml
  - cert-manager/flux.yaml
  - reflector/flux.yaml
  - reloader/flux.yaml
  - traefik/flux.yaml
  - crowdsec/flux.yaml
  - postgres/flux.yaml
  - mongodb/flux.yaml
  - common-secrets/flux.yaml

  # Apps
  - vaultwarden/flux.yaml
  - voidauth/flux.yaml
  - tekton/flux.yaml
  - piped/flux.yaml
  - timelinize/flux.yaml
  - forgejo/flux.yaml
