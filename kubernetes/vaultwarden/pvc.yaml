apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-pvc
  namespace: vaultwarden
  labels:
    app: vaultwarden
  annotations:
    local-path-provisioner/uid: "1000"
    local-path-provisioner/gid: "1000"
spec:
  storageClassName: local-bunker
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
