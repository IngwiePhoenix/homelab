apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pkvault-pvc
  namespace: pkvault
  labels:
    app: pkvault
  annotations:
    local-path-provisioner/uid: "0"
    local-path-provisioner/gid: "0"
    local-path-provisioner/perm: "0700"
spec:
  storageClassName: local-bunker
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
