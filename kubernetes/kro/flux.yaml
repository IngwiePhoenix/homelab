apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kro
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/kro/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kro-helmrelease
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kro-rgd-valkey
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/kro/install/rgd-valkey
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  wait: true
  dependsOn:
    - name: kro
    - name: external-secrets
