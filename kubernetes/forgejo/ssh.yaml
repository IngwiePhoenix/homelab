apiVersion: traefik.io/v1alpha1
kind: TCPRoute
metadata:
  name: forgejo-ssh-tcproute
  namespace: forgejo
spec:
  entryPoints:
    # internal: on service
    # external: on node
    - ssh
  rules:
    # catch-all; raw TCP
    - match: HostSNI(`*`)
  services:
    - name: forgejo-svc
      port: 2222
