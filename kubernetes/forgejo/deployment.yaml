apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-app
  namespace: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        #- name: wait4x-db
        #  image: wait4x/wait4x:latest
        #  command:
        #    - wait4x
        #    - postgresql
        - name: boot
          image: codeberg.org/forgejo/forgejo:17.0.2
          args:
            - /bin/sh
            - -ec
            - |
              echo "Preparing Forgejo configuration..."
              /etc/s6/gitea/setup

              echo "Fixing Git SSH directory ownership..."
              chown -R git:git /data/git/.ssh
              chmod 700 /data/git/.ssh

              if [ -f /data/git/.ssh/authorized_keys ]; then
                  chmod 600 /data/git/.ssh/authorized_keys
              fi

              CONFIG=/data/gitea/conf/app.ini

              if [ ! -s "$CONFIG" ]; then
                echo "ERROR: Forgejo configuration was not generated!"
                exit 1
              fi

              echo "Migrating Forgejo database..."
              su-exec git forgejo --config "$CONFIG" migrate

              echo "Checking for existing VoidAuth OIDC source..."
              if su-exec git forgejo --config "$CONFIG" admin auth list 2>/dev/null | grep -Fq "VoidAuth"; then
                echo "VoidAuth OIDC source already configured."
                exit 0
              fi

              echo "Configuring VoidAuth OIDC source..."
              exec su-exec git forgejo --config "$CONFIG" admin auth add-oauth \
                --name "VoidAuth" \
                --provider "openidConnect" \
                --key "${OIDC_CLIENT_ID}" \
                --secret "${OIDC_CLIENT_SECRET}" \
                --auto-discover-url "${OIDC_DISCOVERY_URL}" \
                --scopes "openid,profile,email,groups" \
                --group-claim-name "groups" \
                --admin-group "forgejo-admin" \
                --skip-local-2fa
          volumeMounts:
            - name: data
              mountPath: /data
          envFrom:
            - secretRef:
                name: forgejo-env
          env:
            - name: FORGEJO__database__DB_TYPE
              value: "postgres"
            - name: FORGEJO__database__HOST
              valueFrom:
                secretKeyRef:
                  name: forgejo-db-creds
                  key: HOST
            - name: FORGEJO__database__PORT
              valueFrom:
                secretKeyRef:
                  name: forgejo-db-creds
                  key: PORT
            - name: FORGEJO__database__NAME
              valueFrom:
                secretKeyRef:
                  name: forgejo-db-creds
                  key: DATABASE
            - name: FORGEJO__database__USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-db-creds
                  key: LOGIN
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-db-creds
                  key: PASSWORD
            # Needed only for the init container:
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: forgejo-oidc-creds
                  key: client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-oidc-creds
                  key: client-secret
            - name: OIDC_DISCOVERY_URL
              valueFrom:
                secretKeyRef:
                  name: forgejo-oidc-creds
                  key: discovery-url
      containers:
        - name: app
          image: codeberg.org/forgejo/forgejo:17.0.2
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 22
              name: ssh
          envFrom:
            - secretRef:
                name: forgejo-env
          env:
            - name: FORGEJO__database__DB_TYPE
              value: "postgres"
            - name: FORGEJO__database__HOST
              valueFrom:
                secretKeyRef:
                  name: forgejo-db-creds
                  key: HOST
            - name: FORGEJO__database__PORT
              valueFrom:
                secretKeyRef:
                  name: forgejo-db-creds
                  key: PORT
            - name: FORGEJO__database__NAME
              valueFrom:
                secretKeyRef:
                  name: forgejo-db-creds
                  key: DATABASE
            - name: FORGEJO__database__USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-db-creds
                  key: LOGIN
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-db-creds
                  key: PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-pvc
