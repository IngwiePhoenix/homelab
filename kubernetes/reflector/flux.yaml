apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reflector
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/reflector
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: reflector-helmrelease
      namespace: flux-system
