apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nametag-photos-pvc
  namespace: nametag
  annotations:
    local-path-provisioner/uid: "1001"
    local-path-provisioner/gid: "1001"
    local-path-provisioner/perm: "0700"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-bunker
  resources:
    requests:
      storage: 5Gi
