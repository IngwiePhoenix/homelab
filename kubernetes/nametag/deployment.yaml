apiVersion: apps/v1
kind: Deployment
metadata:
  name: nametag-app
  namespace: nametag
  labels:
    app: nametag
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nametag
  template:
    metadata:
      labels:
        app: nametag
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: wait-for-postgres
          image: wait4x/wait4x:latest@sha256:aae91ea65a38117ac07c84c7e1122691ac91c3b60529edcb8fe62292d105d8ff
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            - postgres://$(LOGIN):$(PASSWORD)@$(HOST):$(PORT)/$(DATABASE)
            - --timeout
            - 10m
          envFrom:
            - secretRef:
                name: nametag-db-creds
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: app
          image: ghcr.io/mattogodoy/nametag:0.68.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nametag-config-cm
            - secretRef:
                name: nametag-env
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: nametag-db-creds
                  key: HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: nametag-db-creds
                  key: PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: nametag-db-creds
                  key: DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: nametag-db-creds
                  key: LOGIN
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nametag-db-creds
                  key: PASSWORD
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: photos
              mountPath: /app/data/photos
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: photos
          persistentVolumeClaim:
            claimName: nametag-photos-pvc
