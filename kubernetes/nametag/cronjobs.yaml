apiVersion: batch/v1
kind: CronJob
metadata:
  name: nametag-send-reminders-cronjob
  namespace: nametag
spec:
  schedule: "0 8 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cron
              image: alpine:3.24.4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  wget -q -O /dev/null \
                    --header="Authorization: Bearer ${CRON_SECRET}" \
                    "http://nametag-svc:3000/api/cron/send-reminders"
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: nametag-env
                      key: CRON_SECRET
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
---
