apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres-cnpg
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/postgres/cloudnative-pg
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cnpg-helmrelease
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres-cnpg-instance
  namespace: flux-system
spec:
  targetNamespace: postgres
  interval: 10m
  path: ./kubernetes/postgres/cloudnative-pg-instance
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  dependsOn:
    - name: postgres-cnpg
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: default-cluster
      namespace: postgres
  healthCheckExprs:
      - apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        current: >
          has(status.conditions) &&
          status.conditions.exists(c,
            c.type == 'Ready' && c.status == 'True'
          ) &&
          has(status.readyInstances) &&
          status.readyInstances == spec.instances
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres-operator
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/postgres/postgres-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: postgres-operator-helmrelease
      namespace: flux-system
  dependsOn:
    - name: postgres-cnpg
    - name: postgres-cnpg-instance
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres-instance
  namespace: flux-system
spec:
  targetNamespace: postgres
  interval: 10m
  path: ./kubernetes/postgres/postgres-operator-instance
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-repo
  dependsOn:
    - name: postgres-cnpg
    - name: postgres-cnpg-instance
    - name: postgres-operator
  healthChecks:
    - apiVersion: postgresql.easymile.com/v1alpha1
      kind: PostgresqlEngineConfiguration
      name: default-cluster-instance
      namespace: postgres
  healthCheckExprs:
    - apiVersion: postgresql.easymile.com/v1alpha1
      kind: PostgresqlEngineConfiguration
      current: >
        has(status.ready) && status.ready
      failed: >
        has(status.phase) && status.phase == 'Failed'
