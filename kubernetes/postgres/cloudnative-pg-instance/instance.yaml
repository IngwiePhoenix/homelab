apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: default-cluster
  namespace: postgres
spec:
  instances: 2

  livenessProbeTimeout: 120
  probes:
    liveness:
      timeoutSeconds: 10

  # Ensure everyone is forced out after 30sec.
  # My cluster isnt ultra fast over NFS on HDDs - so uh, yeah.
  # Get fucked? xD
  smartShutdownTimeout: 30

  # Fix the container's uid/gid pair
  postgresUID: 26
  postgresGID: 26

  inheritedMetadata:
    annotations:
      local-path-provisioner/uid: "26"
      local-path-provisioner/gid: "26"
      local-path-provisioner/perm: "0700"

  enableSuperuserAccess: true
  storage:
    storageClass: "local-bunker"
    size: 10Gi
  walStorage:
    # Will move to SSD later. Keep on NFS for now.
    storageClass: "local-bunker"
    size: 5Gi

  affinity:
    nodeSelector:
      homelab/location: internal