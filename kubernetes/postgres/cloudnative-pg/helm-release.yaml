apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-helmrelease
  namespace: flux-system
spec:
  interval: 30m
  releaseName: cnpg
  targetNamespace: cnpg-system
  timeout: 10m

  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.1"
      sourceRef:
        kind: HelmRepository
        name: cnpg-helmrepo
        namespace: flux-system
      interval: 1h

  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3

  values:
    nodeSelector:
      homelab/location: internal
    config:
      data:
        ENABLE_INSTANCE_MANAGER_INPLACE_UPDATES: "true"